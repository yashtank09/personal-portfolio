name: Publish production portfolio

on:
  workflow_call:
    secrets:
      GH_TOK:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
      url: https://yashtank.co.in
    steps:
      - name: Checkout hosting repository
        uses: actions/checkout@v4
        with:
          repository: yashtank09/yashtank09.github.io
          ref: main
          token: ${{ secrets.GH_TOK }}
          path: hosting
      - name: Download validated production build
        uses: actions/download-artifact@v4
        with:
          name: prod-build
          path: production
      - name: Update published files
        run: |
          test -s production/index.html
          test -s production/CNAME
          grep -Fxq 'yashtank.co.in' production/CNAME
          rsync -av --delete --exclude='.git/' --exclude='.github/' production/ hosting/
          touch hosting/.nojekyll
      - name: Publish changes
        working-directory: hosting
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No deployment changes.'
          else
            git commit -m "Deploy portfolio ${SOURCE_SHA}"
            git push origin main
          fi
