name: Angular portfolio checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build:prod
      - run: npx playwright install --with-deps chromium
      - name: Verify production routes and accessibility
        env:
          BROWSER_CHANNEL: chromium
        run: |
          npm run preview > /tmp/portfolio-preview.log 2>&1 &
          curl --retry 10 --retry-delay 1 --retry-connrefused --fail http://localhost:4300/ > /dev/null
          npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-validation
          path: qa/
