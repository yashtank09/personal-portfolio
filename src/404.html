<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Page Not Found | Yash Tank</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; color: #172033; background: #f7f4ee; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
    main { width: min(42rem, calc(100% - 3rem)); }
    .code { color: #8a6740; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1 { font-family: Georgia, serif; font-size: clamp(2.5rem, 8vw, 5rem); margin: .5rem 0 1rem; }
    p { font-size: 1.1rem; line-height: 1.7; }
    a { display: inline-block; margin-top: 1rem; padding: .85rem 1.2rem; border-radius: .4rem; color: white; background: #172033; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found.</h1>
    <p>The page you requested does not exist or may have moved.</p>
    <a href="/">Return to Yash Tank's portfolio</a>
  </main>
</body>
</html>
