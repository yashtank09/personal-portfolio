<yt-hero hero-eyebrow="Academic Background" hero-title="My" hero-serif="Education"></yt-hero>

<div class="section container" id="education-timeline">
<div class="timeline">
<div class="timeline-item">
<div class="timeline-icon"><i class="bi bi-mortarboard-fill"></i>
</div>
<div class="timeline-content">
<h5>Master of Computer Applications <strong>(MCA)</strong></h5>
<p class="timeline-meta">Gujarat Technological University <span class="timeline-date">2022</span></p>
</div>
</div>
<div class="timeline-item">
<div class="timeline-icon"><i class="bi bi-mortarboard-fill"></i>
</div>
<div class="timeline-content">
<h5>Bachelor of Computer Applications <strong>(BCA)</strong></h5>
<p class="timeline-meta">SSS Dharmajivandasji Institute of IT <span class="timeline-date">2020</span></p>
</div>
</div>
</div>
</div>
<div class="section CTA-section">
    <div class="container timeline" id="achievements">
        <master-titles title-shadow="Learning" title-over="Certifications"></master-titles>
        
        <div class="achievements-grid">
<div class="achievement-card">
<div class="achievement-body">
<h3>Google Cloud Skill Boost / Qwiklabs Trivia</h3>
<p class="achievement-text">Google</p>
</div>
</div>
            <div class="achievement-card" *ngFor="let achives of achived">
                <img [src]="achives.achievImgSrc" [alt]="achives.achievImgAlter" class="achievement-img">
                <div class="achievement-body">
                    <p class="achievement-text">{{ achives.achievDescription }}</p>
                    <a [href]="baseCourseraCertificationApi + achives.certificateId" target="_blank" rel="noopener noreferrer" class="achievement-link">
                        Verify Certificate <i class="bi bi-box-arrow-up-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
